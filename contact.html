<!doctype html>
<html>
  <head>
    <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <link rel="preload" href="style.css" />
    <script src="script.js"></script>
    <title>Ribalta TTRPG: Linkage</title>
  </head>
  <body>
    <header class="header-flex">
      <nav>
        <div class="navbar">
          <a href="index.html">
            <div class="btn-primary">
              <img src="assets/images/Ribalta64x128Not.png" alt="Ribalta" />
            </div>
          </a>
          <a href="world.html">
            <div class="btn-primary redaction-decay">World</div>
          </a>
          <a href="system.html">
            <div class="btn-primary  redaction-decay">System</div>
          </a>
          <a href="contact.html">
            <div class="btn-primary redaction-decay">Linkage</div>
          </a>
        </div>
      </nav>
    </header>
    <h2>Napisz do mnie</h2>
      <form id="contact-form" class="contact-form">
        <div class="form-group">
          <label for="email">Twój E-mail:</label>
          <input
            type="email"
            id="email"
            name="email"
            placeholder="np. jan@kowalski.pl"
            required
          />
        </div>

        <div class="form-group">
          <label for="subject">Temat wiadomości:</label>
          <select id="subject" name="subject" required>
            <option value="" disabled selected>Wybierz temat...</option>
            <option value="wspolpraca">Współpraca</option>
            <option value="pytanie">Pytanie do projektu</option>
            <option value="inne">Inne</option>
          </select>
        </div>

        <div class="form-group">
          <label for="message">Treść wiadomości:</label>
          <textarea
            id="message"
            name="message"
            rows="5"
            placeholder="Wpisz treść swojej wiadomości tutaj..."
            required
          ></textarea>
        </div>

        <input type="submit" value="Wyślij wiadomość" class="submit-btn" />
      </form>
    </main>
  </body>
</html>
